plugins { id 'net.fabricmc.fabric-loom' version '1.17.12' }
base.archivesName = 'starfall-mc26.2'
repositories { mavenCentral(); maven { url = 'https://maven.terraformersmc.com/releases/' } }
loom { splitEnvironmentSourceSets(); mods { starfall { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
dependencies {
 minecraft 'com.mojang:minecraft:26.2'
 implementation 'net.fabricmc:fabric-loader:0.19.3'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'
 clientCompileOnly 'com.terraformersmc:modmenu:20.0.2'
 clientRuntimeOnly 'com.terraformersmc:modmenu:20.0.2'
 testImplementation platform('org.junit:junit-bom:5.13.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
jar { from('LICENSE') }
sourceSets { smoke { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations { smokeImplementation.extendsFrom implementation }
tasks.register('smokeJar', Jar) {
    dependsOn tasks.named('smokeClasses')
    archiveClassifier = 'smoke-tests'
    from sourceSets.smoke.output
}
